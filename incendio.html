trombone:()=>[311,293,277,233].forEach((f,i)=>tone('sawtooth',f,f*.97,i==3?.7:.3,.4,i*.28,i==3?6:0)),snore:()=>{tone('sawtooth',90,70,.7,.35,0,5);noise(.7,400,150,.2)},
tap:()=>tone('square',700,500,.05,.35),blip:()=>tone('square',900,1300,.06,.3),hmm:()=>{tone('sine',300,260,.25,.5);tone('sine',320,360,.25,.5,.28)},
splat:()=>{noise(.25,1800,150,.9);tone('sine',200,60,.2,.6)},crash:()=>{noise(.7,5000,200,1);tone('sawtooth',90,40,.5,.5)},honk:()=>tone('square',260,240,.35,.5,0,25)};
function sfx(n){if(SF[n])SF[n]()}
function fire(a,b){for(const e of EV)if(e.t>a&&e.t<=b)sfx(e.n)}
function mkEv(){EV=[];S.forEach((c,i)=>{const d=c.d,add=(t,n)=>EV.push({t:c.s+t,n});if(i)add(.001,'whoosh');
 (Array.isArray(c.sfx)?c.sfx:c.sfx?[c.sfx]:[]).forEach(x=>{const[n,t]=x.split('@');add(+t||0,n)});
 if(c.chip)add(.12,'blip');if(c.pop)add(.05,c.pop.sfx||'boing');
 (c.objs||[]).filter(o=>!o.fixo).slice(0,4).forEach((o,k)=>add(.1+k*.15,'pof'));
 (c.atores||[]).forEach(o=>{const a=(o.i||0)*d,b=(o.f??1)*d,f=o.p||[0,0],to=o.to||f,mv=to[0]!=f[0]||to[1]!=f[1],ps=o.pose||(mv?'andar':'idle'),per=ps=='correr'?PI/14:PI/7;
  const rep=(p0,p1,n,st)=>{for(let t=p0;t<p1;t+=st)add(t,n)};
  if(mv){if(o.pulo){add(a,'boing');add(b,'thud')}else{for(let k=Math.ceil((c.s+a)/per);k*per<c.s+b;k++)EV.push({t:k*per,n:'step'});add(b,'step')}}
  if(ps=='surpreso')add(a,'gasp');if(ps=='martelo')rep(a,d,'bonk',.52);if(ps=='bater')rep(a,d,'toc',.5);if(ps=='bravo')add(a,'buzz');
  if(ps=='comemorar')add(a,'tada');if(ps=='dormir')rep(a,d,'snore',1.6);if(ps=='subir')rep(a,d,'tap',.52);if(ps=='apontar')add(a+.05,'blip')})});
 EV.sort((x,y)=>x.t-y.t)}
function play(){AC.resume();if(X>=T-.05)X=0;pl=1;last=-1;mkEv();PV=X-.001;t0=performance.now()-X*1000;$('#p').textContent='⏸ Pausar';if(au.src){au.currentTime=X;au.play()}tick()}
function stop(){pl=0;au.pause();$('#p').textContent='▶ Play';if(onEnd){const f=onEnd;onEnd=null;f()}}
function tick(){if(!pl)return;X=(performance.now()-t0)/1000;fire(PV,Math.min(X,T));PV=X;if(X>=T){X=T;frame(T);stop();return}frame(X);requestAnimationFrame(tick)}
$('#p').onclick=()=>pl?stop():play();
$('#r').oninput=e=>{if(pl)stop();seek(+e.target.value)};
$('#l').onclick=()=>{try{load()}catch(e){alert('JSON inválido: '+e.message)}};
$('#a').onchange=e=>{au.src=URL.createObjectURL(e.target.files[0]);if(!src){src=AC.createMediaElementSource(au);src.connect(vg)}au.onloadedmetadata=()=>{load()}};
$('#e').onclick=()=>{if(pl)stop();X=0;const ms=new MediaStream([...out.captureStream(30).getTracks(),...dst.stream.getTracks()]);
 const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 const rc=new MediaRecorder(ms,{mimeType:mt,videoBitsPerSecond:8e6}),ch=[];rc.ondataavailable=e=>ch.push(e.data);
 rc.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mt}));a.download='video.'+(mt.includes('mp4')?'mp4':'webm');a.click()};
 rc.start();onEnd=()=>setTimeout(()=>rc.stop(),300);play()};
load();
