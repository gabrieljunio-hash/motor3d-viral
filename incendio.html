<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incêndio em casa — Assets 3D | Motor 3D Viral</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101319;color:#f4f4f4;font:14px system-ui;display:flex;align-items:center;flex-direction:column;padding:12px}
h1{font-size:16px;margin:5px 0 10px}#stage{width:min(100%,420px);aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#171c25;box-shadow:0 12px 42px #0009}canvas{width:100%;height:100%;display:block;touch-action:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px}button{border:1px solid #555e6b;background:#252c37;color:white;border-radius:8px;padding:9px 13px;font:inherit}
#status{font-size:12px;color:#aab2bd;text-align:center;max-width:420px}
</style></head>
<body>
<h1>MOTOR 3D VIRAL · INCÊNDIO EM CASA</h1>
<div id="stage"><canvas id="view"></canvas></div>
<div class="controls"><button id="play">⏸ Pausar</button><button id="smoke">Fumaça: ligada</button><button id="fire">Fogo: ligado</button><button id="reset">↺ Câmera</button></div>
<div id="status">Cena 3D em construção · arraste para girar · pinça para aproximar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const stage=document.querySelector('#stage'),canvas=document.querySelector('#view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();scene.background=new THREE.Color('#171c29');scene.fog=new THREE.Fog('#171c29',13,28);
const camera=new THREE.PerspectiveCamera(35,stage.clientWidth/stage.clientHeight,.1,80);
scene.add(new THREE.HemisphereLight(0x9aaac8,0x342b28,.95));
const key=new THREE.DirectionalLight(0xffd6a6,2.1);key.position.set(-5,8,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;key.shadow.bias=-.0003;scene.add(key);
const fireLight=new THREE.PointLight(0xff5b16,2.4,11,2);fireLight.position.set(-2.8,1.1,-2.2);scene.add(fireLight);
const fill=new THREE.DirectionalLight(0x7897c7,.65);fill.position.set(5,4,-5);scene.add(fill);
const mat=(c,r=.82,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const wall=mat('#b7aa99'),wallSide=mat('#7c756f'),floorMat=mat('#51483f'),wood=mat('#68462f'),woodLight=mat('#91633e'),white=mat('#e7e0d5'),sheet=mat('#536f91'),blanket=mat('#354e70'),skin=mat('#c98d68'),hair=mat('#34251f'),shirt=mat('#b74d39'),pants=mat('#344052'),black=mat('#191b20'),glass=mat('#405d79',.25),metal=mat('#777d83',.45,.55);
const root=new THREE.Group();scene.add(root);
function box(parent,m,p,s){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.position.set(...p);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function sphere(parent,m,p,s,seg=24){const o=new THREE.Mesh(new THREE.SphereGeometry(1,seg,16),m);o.position.set(...p);o.scale.set(...s);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,m,p,r1,r2,h,rot=[0,0,0]){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),m);o.position.set(...p);o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// Room: open front for camera, back wall, side wall, floor and ceiling edge
box(root,floorMat,[0,-.12,0],[8,.24,8]);
box(root,wall,[0,2.3,-3.85],[8,4.6,.22]);
box(root,wallSide,[-3.9,2.3,0],[.22,4.6,7.8]);
box(root,wallSide,[3.9,2.3,0],[.22,4.6,7.8]);
box(root,white,[0,4.62,0],[8,.12,7.8]);
// skirting
box(root,wood,[0,.12,-3.7],[7.8,.24,.12]);box(root,wood,[-3.72,.12,0],[.12,.24,7.4]);
// Door on back wall
const door=new THREE.Group();door.position.set(2.55,0,-3.68);root.add(door);
box(door,woodLight,[0,1.15,0],[1.25,2.3,.12]);box(door,wood,[0,1.15,.075],[1.08,2.12,.035]);sphere(door,metal,[.43,1.05,.13],[.055,.055,.055]);
// Window on left wall, night blue panes
box(root,white,[-3.77,2.55,-1.55],[.12,1.75,2.1]);box(root,glass,[-3.68,2.55,-1.55],[.08,1.52,1.86]);
box(root,white,[-3.61,2.55,-1.55],[.08,.07,1.9]);box(root,white,[-3.61,2.55,-1.55],[.08,1.6,.07]);
// Bed frame, mattress, pillows and blanket
const bed=new THREE.Group();bed.position.set(-.45,0,.45);root.add(bed);
box(bed,wood,[0,.48,0],[2.65,.35,3.5]);box(bed,white,[0,.77,0],[2.58,.28,3.42]);
box(bed,wood,[0,1.1,-1.7],[2.7,1.15,.16]);
box(bed,white,[-.67,.98,-1.28],[.8,.23,.62]);box(bed,white,[.28,.98,-1.28],[.8,.23,.62]);
box(bed,blanket,[0,.96,.18],[2.5,.22,2.15]);
// Sleeping person, head toward headboard, lying on back
const human=new THREE.Group();human.position.set(-.45,0,.45);bed.add(human);
sphere(human,skin,[0,1.16,-.82],[.43,.24,.42]);
sphere(human,hair,[0,1.31,-.93],[.43,.16,.38]);
sphere(human,skin,[-.16,1.15,-.49],[.045,.025,.035]);sphere(human,skin,[.16,1.15,-.49],[.045,.025,.035]);
box(human,shirt,[0,1.12,-.02],[.95,.3,1.12]);
box(human,pants,[-.28,1.08,.9],[.36,.24,.9]);box(human,pants,[.28,1.08,.9],[.36,.24,.9]);
sphere(human,skin,[-.56,1.1,.1],[.15,.13,.48]);sphere(human,skin,[.56,1.1,.1],[.15,.13,.48]);
// bedside table, lamp and phone
box(root,wood,[1.65,.55,-.7],[.85,1.1,.8]);box(root,woodLight,[1.65,1.12,-.7],[.92,.12,.86]);
cyl(root,white,[1.65,1.48,-.7],.12,.16,.6);sphere(root,mat('#f2d7a1'),[1.65,1.83,-.7],[.34,.25,.34]);
box(root,black,[1.38,1.2,-.42],[.17,.035,.28]);
// Rug and small room details
box(root,mat('#6a5145'),[-.3,.015,2.3],[3.2,.04,1.45]);
box(root,wood,[0,2.6,-3.68],[1.5,.12,.12]); // shelf
// Smoke detector on ceiling
const detector=new THREE.Group();detector.position.set(-.8,4.48,-1.2);root.add(detector);
cyl(detector,white,[0,0,0],.22,.22,.12);sphere(detector,mat('#d94a3d'),[0,-.07,.02],[.045,.025,.045]);
// Fire at doorway threshold and lower wall
const flameMat=new THREE.MeshBasicMaterial({color:0xff641e,transparent:true,opacity:.9});
const flameCore=new THREE.MeshBasicMaterial({color:0xffd15a,transparent:true,opacity:.92});
const flames=[];
for(let i=0;i<8;i++){const g=new THREE.Group();g.position.set(2.05+(i%4)*.22,.08,-3.0+Math.floor(i/4)*.26);root.add(g);
 const h=.55+Math.random()*.65;const f=new THREE.Mesh(new THREE.ConeGeometry(.16+Math.random()*.08,h,9),i%3===0?flameCore:flameMat);f.position.y=h*.48;g.add(f);flames.push({g,f,base:h,phase:Math.random()*6})}
const smokeMat=new THREE.MeshStandardMaterial({color:'#777b82',transparent:true,opacity:.23,roughness:1,depthWrite:false});
const smokeMat2=new THREE.MeshStandardMaterial({color:'#a0a1a3',transparent:true,opacity:.16,roughness:1,depthWrite:false});
const smoke=[];
for(let i=0;i<22;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.28+Math.random()*.22,12,10),i%3?smokeMat:smokeMat2);s.position.set(2.3+(Math.random()-.5)*.7,1.2+i*.13,-3.1+(Math.random()-.5)*.5);s.scale.set(1,1.25,1);root.add(s);smoke.push({mesh:s,phase:Math.random()*6,baseY:s.position.y})}
// A visible smoky layer under ceiling
const haze=new THREE.Mesh(new THREE.PlaneGeometry(7.2,7),new THREE.MeshBasicMaterial({color:0x4b4b50,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));haze.rotation.x=-Math.PI/2;haze.position.set(0,4.36,-.1);root.add(haze);
let showSmoke=true,showFire=true,playing=true;
let yaw=.68,pitch=.14,dist=12.4,drag=false,px=0,py=0;
function updateCamera(){pitch=Math.max(-.02,Math.min(.6,pitch));dist=Math.max(8,Math.min(18,dist));camera.position.set(Math.sin(yaw)*dist,2.5+Math.sin(pitch)*dist*.55,Math.cos(yaw)*dist);camera.lookAt(0,1.8,-.1)}
stage.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.008;pitch+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;updateCamera()});
stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);
stage.addEventListener('wheel',e=>{e.preventDefault();dist+=e.deltaY*.009;updateCamera()},{passive:false});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'⏸ Pausar':'▶ Retomar'};
document.querySelector('#smoke').onclick=()=>{showSmoke=!showSmoke;smoke.forEach(x=>x.mesh.visible=showSmoke);haze.visible=showSmoke;document.querySelector('#smoke').textContent='Fumaça: '+(showSmoke?'ligada':'desligada')};
document.querySelector('#fire').onclick=()=>{showFire=!showFire;flames.forEach(x=>x.g.visible=showFire);fireLight.visible=showFire;document.querySelector('#fire').textContent='Fogo: '+(showFire?'ligado':'desligado')};
document.querySelector('#reset').onclick=()=>{yaw=.68;pitch=.14;dist=12.4;updateCamera()};
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(playing){
 flames.forEach((x,i)=>{const k=1+.17*Math.sin(t*10+x.phase);x.g.scale.y=k;x.g.rotation.z=.08*Math.sin(t*7+x.phase);});
 smoke.forEach((x,i)=>{x.mesh.position.y=x.baseY+((t*.22+x.phase)%2.8);x.mesh.position.x=2.3+Math.sin(t*.55+x.phase)*.34;x.mesh.scale.setScalar(.8+((t*.22+x.phase)%2.8)*.16);});
 fireLight.intensity=showFire?2.1+.7*Math.sin(t*13):0;
 human.position.y=.018*Math.sin(t*1.3);
}updateCamera();renderer.render(scene,camera)}
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(stage);
updateCamera();animate();
})();
</script></body></html>
